!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>0050 允贏</title>
  <style>
    body { font: 40px Helvetica, sans-serif; }
    input { font: inherit; width: 250px; padding: 25px; }
    a { font-size: 16px; margin-left: 10px; }
  </style>
</head>
<body>
  <p>
    <input id="b" type="number" placeholder="買入" value="7"> 塊 
    <input id="n" type="number" value="1"> 張
  </p>
  <p><input id="s" type="number" placeholder="賣出" value="100"> 塊</p>
  <p><input id="d" type="number" placeholder="折" value="1.68"> 折</p>
  <p id="r"></p>

  <script>
    const $ = id => document.getElementById(id);

    function calc() {
      let [b,n,s,d] = ['b','n','s','d'].map(id => Number($(id).value) || 0);
      if (!d) d = 1.68;

      const buy  = (b*1000 + b*0.1425*d) * n;
      const sell = (s*999 - s*0.1425*d) * n;

      $('#r').innerHTML = isNaN(sell-buy) ? '再來一次' :
        `賺 ${(sell-buy).toFixed(2)} 元<br>買 ${buy.toFixed(2)} 元<br>賣 ${sell.toFixed(2)} 元`;
    }

    // 監聽輸入變化
    ['b','n','s','d'].forEach(id => $(id).addEventListener('input', calc));

    calc(); // 初次計算
  </script>
</body>
</html>
